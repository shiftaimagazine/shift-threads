name: 카드 이미지 만들기
on:
  push:
    paths: ['queue/**', 'scripts/render.mjs']
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: threads-repo, cancel-in-progress: false }
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - run: node scripts/render.mjs
      - name: 이미지 저장
        run: |
          git config user.name "shift-threads-bot"; git config user.email "actions@users.noreply.github.com"
          node scripts/status.mjs || true; git add media status.json; git diff --cached --quiet || (git commit -m "카드 이미지" && git pull --rebase && git push)
