name: Gemini 음성 장면 나누기 시험
on:
  workflow_dispatch:
    inputs:
      model: { description: '모델', default: 'gemini-3.8-flash-lite-tts' }
permissions: { contents: write }
concurrency: { group: threads-repo, cancel-in-progress: false }
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pip install numpy
      - name: 시험
        env: { GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}' }
        run: |
          mkdir -p samples/tts/split; for n in tag plain; do sed -i "s/MODEL_PLACEHOLDER/${{ inputs.model }}/" tools/job-$n.json; (python3 tools/tts_gemini.py tools/job-$n.json 2>&1 | tee samples/tts/split/$n-log.txt) || true; sleep 25; done
      - name: 저장
        if: always()
        run: |
          git config user.name "shift-threads-bot"; git config user.email "actions@users.noreply.github.com"
          git checkout -- tools; git add samples; git diff --cached --quiet || (git commit -m "Gemini 음성 나누기 시험" && git pull --rebase && git push)
