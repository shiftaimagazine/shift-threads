name: 유튜브 쇼츠 예약 업로드
on:
  schedule:
    - cron: '47 19 * * *'    # 04:47 (한국): 오늘 공개할 쇼츠 2편을 예약 (PC 꺼져 있어도 됨). 2026-11-03 사용자 요청: 밤 22:35 → 새벽으로 옮겨 밤늦게 다시 만든 영상도 반영
    - cron: '35 22 * * *'    # 07:35 (한국): 새벽에 못 올린 게 있으면 한 번 더 (09:00 공개 전)
    # 2026-11-26 사용자 "유튜브도 당연히 지금 업로드해야 하는데 왜 안 하냐": 늦게 만든 편(--today)이 다음 날 07:30 으로 밀리던 것 → 같은 날 올라가게 낮·저녁에도 확인.
    #   올릴 게 없으면 유튜브 API 를 부르지 않고 바로 끝남(할당량·비용 없음). 공개 시각이 지난 편은 지금+1시간 뒤 빈 자리로 다시 잡힘(scripts/youtube.mjs slotFor).
    - cron: '35 1 * * *'     # 10:35 (한국)
    - cron: '35 4 * * *'     # 13:35
    - cron: '35 7 * * *'     # 16:35
    - cron: '35 10 * * *'    # 19:35
    - cron: '35 13 * * *'    # 22:35
  workflow_dispatch:
    inputs:
      mode: { description: 'post = 올리기, check = 채널 연결 확인만', default: 'post' }
      dry_run: { description: '1 이면 미리보기만', default: '0' }
      days: { description: '2 = 오늘 + 내일 공개분까지 미리 예약 (GitHub 예약 실행이 멈췄을 때 전날 저녁에 손으로)', default: '1' }
permissions: { contents: write }
concurrency: { group: threads-repo, cancel-in-progress: false }
jobs:
  youtube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - run: node scripts/youtube.mjs
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          DRIVE_API_KEY: ${{ secrets.DRIVE_API_KEY }}
          MODE: ${{ inputs.mode || 'post' }}
          DRY_RUN: ${{ inputs.dry_run || '0' }}
          DAYS: ${{ inputs.days || '1' }}
      - name: 기록 저장
        if: always()
        run: |
          git config user.name "shift-threads-bot"; git config user.email "actions@users.noreply.github.com"
          git add youtube; git diff --cached --quiet || (git commit -m "유튜브 예약 기록" && git pull --rebase && git push)
