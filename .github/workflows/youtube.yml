name: 유튜브 쇼츠 예약 업로드
on:
  schedule:
    - cron: '47 19 * * *'    # 04:47 (한국): 오늘 공개할 쇼츠 2편을 예약 (PC 꺼져 있어도 됨). 2026-11-03 사용자 요청: 밤 22:35 → 새벽으로 옮겨 밤늦게 다시 만든 영상도 반영
    - cron: '35 22 * * *'    # 07:35 (한국): 새벽에 못 올린 게 있으면 한 번 더 (09:00 공개 전)
  workflow_dispatch:
    inputs:
      mode: { description: 'post = 올리기, check = 채널 연결 확인만', default: 'post' }
      dry_run: { description: '1 이면 미리보기만', default: '0' }
permissions: { contents: write }
concurrency: { group: threads-repo, cancel-in-progress: false }
jobs:
  youtube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - run: node scripts/youtube.mjs
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          DRIVE_API_KEY: ${{ secrets.DRIVE_API_KEY }}
          MODE: ${{ inputs.mode || 'post' }}
          DRY_RUN: ${{ inputs.dry_run || '0' }}
      - name: 기록 저장
        if: always()
        run: |
          git config user.name "shift-threads-bot"; git config user.email "actions@users.noreply.github.com"
          git add youtube; git diff --cached --quiet || (git commit -m "유튜브 예약 기록" && git pull --rebase && git push)
