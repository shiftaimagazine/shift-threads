name: PLAY 유튜브 쇼츠 예약 업로드
# 2026-11-24 새로: SHIFT PLAY 쇼츠를 '시프트 플레이' 채널에 예약 업로드 (PC·크롬·Claude 불필요). scripts/youtube-play.mjs 맨 위 설명 참고.
# 비밀값 YT_PLAY_REFRESH_TOKEN 이 없으면 아무것도 하지 않고 끝남(실패로 안 뜸).
on:
  schedule:
    - cron: '52 19 * * *'    # 04:52 (한국): 밤사이 만든 편 예약
    - cron: '52 1 * * *'     # 10:52 (한국): 아침에 만든 편 예약 (12:00·18:00 공개 전)
    - cron: '52 7 * * *'     # 16:52 (한국): 오후에 만든 18:00 편 마지막 기회
  workflow_dispatch:
    inputs:
      mode: { description: 'post = 올리기, check = 채널·재생목록 확인만', default: 'post' }
      dry_run: { description: '1 이면 미리보기만', default: '0' }
permissions: { contents: write }
concurrency: { group: threads-repo, cancel-in-progress: false }
jobs:
  youtube-play:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - run: node scripts/youtube-play.mjs
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_PLAY_REFRESH_TOKEN: ${{ secrets.YT_PLAY_REFRESH_TOKEN }}
          DRIVE_API_KEY: ${{ secrets.DRIVE_API_KEY }}
          MODE: ${{ inputs.mode || 'post' }}
          DRY_RUN: ${{ inputs.dry_run || '0' }}
      - name: 기록 저장
        if: always()
        run: |
          git config user.name "shift-threads-bot"; git config user.email "actions@users.noreply.github.com"
          git add youtube; git diff --cached --quiet || (git commit -m "PLAY 유튜브 예약 기록" && git pull --rebase && git push)
