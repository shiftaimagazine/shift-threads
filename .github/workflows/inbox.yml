name: 댓글 모으기·답글 올리기
on:
  schedule:
    - cron: '50 2,11 * * *'  # 11:50·20:50 (한국): 새 댓글 모으기 — 클라우드 답글 작업(12:25·21:25) 직전에만
  push:
    paths: ['replies/2*.json']   # 클라우드 답글 작업이 답글을 넣으면 바로 올림 (답글만, 댓글 수집은 안 함)
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: threads-repo, cancel-in-progress: false }
jobs:
  inbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - run: node scripts/inbox.mjs
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          MODE: ${{ github.event_name == 'push' && 'reply' || github.event_name == 'schedule' && 'collect' || 'all' }}
      - if: always()
        run: |
          git config user.name "shift-threads-bot"; git config user.email "actions@users.noreply.github.com"
          node scripts/status.mjs || true; git add inbox replies/done.json status.json; git diff --cached --quiet || (git commit -m "댓글함" && git pull --rebase && git push)
