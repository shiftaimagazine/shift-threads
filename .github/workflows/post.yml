name: 쓰레드 올리기
on:
  schedule:
    - cron: '47 * * * *'     # 매시 47분: 예약 시각이 지난 글을 올림 (GitHub 사정으로 몇 분 늦을 수 있음)
  workflow_dispatch:
    inputs:
      mode: { description: 'post = 올리기, check = 키 확인만', default: 'post' }
      dry_run: { description: '1 이면 미리보기만', default: '0' }
permissions: { contents: write }
concurrency: { group: threads-repo, cancel-in-progress: false }
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - run: node scripts/post.mjs
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          MODE: ${{ inputs.mode || 'post' }}
          DRY_RUN: ${{ inputs.dry_run || '0' }}
      - name: 기록 저장
        if: always()
        run: |
          git config user.name "shift-threads-bot"; git config user.email "actions@users.noreply.github.com"
          node scripts/status.mjs || true; git add posted.json status.json; git diff --cached --quiet || (git commit -m "쓰레드 업로드 기록" && git pull --rebase && git push)
