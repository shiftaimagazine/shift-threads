name: 영상 주소 확인 (게시 안 함)
on:
  workflow_dispatch:
    inputs:
      urls: { description: '확인할 영상 주소 (공백으로 구분)', required: true }
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - run: node scripts/video-check.mjs
        env: { THREADS_TOKEN: '${{ secrets.THREADS_TOKEN }}', URLS: '${{ inputs.urls }}' }
